"$schema" = "https://starship.rs/config-schema.json"

add_newline = false

format = """
$custom\
$container\
$directory\
$git_branch\
$git_commit\
$git_state\
$git_metrics\
$git_status\
\n$character
"""

# ----------------------
# Logo
# ----------------------
[custom.logo]
command = "echo devbox"
when = true
style = "bold #f5c2e7" # Catppuccin Pink
format = "[$output]($style) "

# ----------------------
# Container
# ----------------------
[container]
format = "[$symbol\\[$name\\]]($style) "

# ----------------------
# Directory
# ----------------------
[directory]
style = "bold #89b4fa" # Blue
truncate_to_repo = false
truncation_length = 3

# ----------------------
# Git Branch
# ----------------------
[git_branch]
symbol = " "
style = "bold #a6e3a1" # Green
format = "[$symbol$branch]($style) "
# truncation_length = 4
# truncation_symbol = ""

# ----------------------
# Git Commit
# ----------------------
[git_commit]
commit_hash_length = 4
tag_symbol = "󰓹 "

# ----------------------
# Git State
# ----------------------
[git_state]
format = "[($state( $progress_current of $progress_total))]($style) "
cherry_pick = "[ PICKING](bold #f38ba8)"

# ----------------------
# Git Metrics
# ----------------------
[git_metrics]
added_style = "bold #89dceb"      # Sky
deleted_style = "bold #f38ba8"    # Red
format = "[+$added]($added_style)/[-$deleted]($deleted_style) "

# ----------------------
# Git Status
# ----------------------
[git_status]
style = "bold #fab387" # Peach
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"

# ----------------------
# Prompt Character
# ----------------------
[character]
success_symbol = "[](bold #a6e3a1) "
error_symbol = "[](bold #f38ba8) "
